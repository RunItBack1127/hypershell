apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: hypershell
data:
  hypershell-realm.json: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: hypershell
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.3
          args:
            - start-dev
            - --import-realm
          env:
            - name: KC_HOSTNAME
              value: "http://localhost:11880"
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /realms/hypershell
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /realms/hypershell
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: hypershell
  labels:
    app: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 11880
      targetPort: 8080
      protocol: TCP
      name: http
      nodePort: 30090
---
apiVersion: v1
kind: Secret
metadata:
  name: sso-credentials
  namespace: hypershell
  labels:
    app: hypershell-sso
type: Opaque
stringData:
  SSO_ISSUER_URL: "http://keycloak-service:11880/realms/hypershell"
  SSO_FRONTEND_ISSUER_URL: "http://localhost:11880/realms/hypershell"
  SSO_CLIENT_ID: "hypershell-console"
  SSO_CLIENT_SECRET: "dev-secret-do-not-use-in-prod"
  SSO_AUDIENCE: "hypershell-console"
  SSO_REDIRECT_URI: "http://localhost/api/auth/sso/callback"
