apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        hypershell.redhat.io/image-revision: KEYCLOAK_IMAGE_REVISION_PLACEHOLDER
        hypershell.redhat.io/config-revision: KEYCLOAK_CONFIG_REVISION_PLACEHOLDER
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: KEYCLOAK_IMAGE_PLACEHOLDER
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          args:
            - start
            - --optimized
            - --http-enabled=true
            - --hostname-strict=false
            - --import-realm
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HTTP_PORT
              value: "8080"
            - name: KC_HOSTNAME
              value: "http://KEYCLOAK_HOSTNAME_PLACEHOLDER:KEYCLOAK_PORT_PLACEHOLDER"
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: realm-config
              mountPath: /opt/keycloak/data/import/hypershell-realm.json
              subPath: hypershell-realm.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm
        - name: keycloak-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: KEYCLOAK_PORT_PLACEHOLDER
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: keycloak
data:
  hypershell-realm.json: |
    {
      "realm": "hypershell",
      "enabled": true,
      "registrationAllowed": false,
      "clientScopes": [
        {
          "name": "openid",
          "description": "OpenID Connect scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true"
          }
        },
        {
          "name": "profile",
          "description": "OpenID Connect profile scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true"
          },
          "protocolMappers": [
            {
              "name": "preferred username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "email",
          "description": "OpenID Connect email scope",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true"
          },
          "protocolMappers": [
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-attribute-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "email",
                "claim.name": "email",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "openshell:all",
          "description": "Full access to all OpenShell resources",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          }
        }
      ],
      "clients": [
        {
          "clientId": "openshell-cli",
          "enabled": true,
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "fullScopeAllowed": true,
          "redirectUris": ["http://127.0.0.1:*", "http://localhost:*"],
          "webOrigins": ["http://127.0.0.1:*", "http://localhost:*"],
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "defaultClientScopes": ["openid", "email", "profile"],
          "optionalClientScopes": ["openshell:all"],
          "protocolMappers": [
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "consentRequired": false,
              "config": {
                "included.client.audience": "openshell-cli",
                "id.token.claim": "false",
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "sub",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-sub-mapper",
              "consentRequired": false,
              "config": {
                "access.token.claim": "true",
                "introspection.token.claim": "true"
              }
            },
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "consentRequired": false,
              "config": {
                "multivalued": "true",
                "claim.name": "groups",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "introspection.token.claim": "true"
              }
            }
          ]
        },
        {
          "clientId": "hypershell-provisioner",
          "enabled": true,
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "secret": "provisioner-secret"
        }
      ],
      "roles": {
        "realm": [
          { "name": "hypershell-admins", "description": "HyperShell administrators" },
          { "name": "hypershell-users", "description": "HyperShell users" }
        ]
      },
      "users": [
        {
          "username": "admin",
          "enabled": true,
          "firstName": "Local",
          "lastName": "Administrator",
          "email": "admin@hypershell.test",
          "emailVerified": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "admin", "temporary": false }],
          "realmRoles": ["hypershell-admins", "hypershell-users"]
        },
        {
          "username": "developer",
          "enabled": true,
          "firstName": "Local",
          "lastName": "Developer",
          "email": "developer@hypershell.test",
          "emailVerified": true,
          "requiredActions": [],
          "credentials": [{ "type": "password", "value": "developer", "temporary": false }],
          "realmRoles": ["hypershell-users"]
        }
      ],
      "clientScopeMappings": {
        "hypershell-provisioner": [
          { "client": "realm-management", "roles": ["manage-clients", "manage-users"] }
        ]
      }
    }
