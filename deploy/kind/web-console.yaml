apiVersion: v1
kind: ServiceAccount
metadata:
  name: hypershell-web-console
  namespace: NAMESPACE_PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-web-console
  namespace: NAMESPACE_PLACEHOLDER
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hypershell-web-console
  template:
    metadata:
      labels:
        app: hypershell-web-console
      annotations:
        hypershell.redhat.io/baseline-image: WEB_CONSOLE_IMAGE_PLACEHOLDER
        hypershell.redhat.io/image-revision: WEB_CONSOLE_IMAGE_REVISION_PLACEHOLDER
    spec:
      serviceAccountName: hypershell-web-console
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-console
          image: WEB_CONSOLE_IMAGE_PLACEHOLDER
          imagePullPolicy: IMAGE_PULL_POLICY_PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: HYPERSHELL_API_ORIGIN
              value: "http://hypershell-api-server:8000"
            - name: HYPERSHELL_GATEWAY_OIDC_ISSUER
              value: "http://KEYCLOAK_HOSTNAME_PLACEHOLDER:KEYCLOAK_PORT_PLACEHOLDER/realms/hypershell"
            - name: HYPERSHELL_GATEWAY_OIDC_CLIENT_ID
              value: "openshell-cli"
            - name: HYPERSHELL_GATEWAY_OIDC_AUDIENCE
              value: "openshell-cli"
            - name: HYPERSHELL_GATEWAY_OIDC_SCOPES
              value: "openid profile email openshell:all"
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-web-console
  namespace: NAMESPACE_PLACEHOLDER
spec:
  selector:
    app: hypershell-web-console
  ports:
    - name: http
      port: 3000
      targetPort: 8080
