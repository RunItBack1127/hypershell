apiVersion: v1
kind: Secret
metadata:
  name: hypershell-db
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app.kubernetes.io/name: hypershell
    app.kubernetes.io/component: database
type: Opaque
stringData:
  db.host: hypershell-postgres
  db.port: "5432"
  db.name: hypershell
  db.user: hypershell
  db.password: hypershell-dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hypershell-postgres
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app.kubernetes.io/name: hypershell
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hypershell-postgres
  template:
    metadata:
      labels:
        app: hypershell-postgres
        app.kubernetes.io/name: hypershell
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-postgres-run-directory
          image: POSTGRES_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args: ["mkdir -p /work/postgresql && chmod 3775 /work/postgresql"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: postgres-run
              mountPath: /work
      containers:
        - name: postgres
          image: POSTGRES_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            readOnlyRootFilesystem: true
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: hypershell-db
                  key: db.name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hypershell-db
                  key: db.user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hypershell-db
                  key: db.password
          ports:
            - containerPort: 5432
              name: postgres
              protocol: TCP
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "hypershell"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: postgres-run
              mountPath: /var/run/postgresql
              subPath: postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pgdata
          emptyDir: {}
        - name: postgres-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hypershell-postgres
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app.kubernetes.io/name: hypershell
    app.kubernetes.io/component: database
spec:
  selector:
    app: hypershell-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
